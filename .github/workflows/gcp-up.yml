# Sabi GCP staging lifecycle: `up`.
#
# Manual by design (D-033). Bringing the staging environment up costs money, so
# this workflow never runs on push: an operator dispatches it explicitly.
#
# It authenticates to GCP, ensures the Artifact Registry repository exists
# (via gcloud, only when it is absent), builds and pushes the four images into
# it, applies the Terraform stack once, writes the one secret Terraform cannot
# generate, runs the Alembic migrations and the catalogue seed as Cloud Run jobs
# inside the VPC, and prints the mapped URLs and the DNS records to add at
# Namecheap.
#
# The ordering is deliberate. Cloud Run refuses to create a service or job whose
# image is not yet in Artifact Registry, and the provider then leaves the
# half-created service un-State'd (hashicorp/terraform-provider-google#14493).
# So the images must exist before the apply, and the repository must exist
# before the images can be pushed. Ensuring the repository first lets the
# platform and the workloads land in a single apply, with no placeholder
# revision (D-055, superseding the two-phase apply of D-036).
#
# The repository is also declared in Terraform
# (infra/terraform-gcp/artifact_registry.tf). On an environment Terraform
# already tracks it — every `up` after a previous `up` — the ensure step finds
# it and does nothing, and the apply leaves it unchanged. On a fresh environment
# (a first `up`, or the `destroy` -> `up` rebuild of D-033) it is not in state
# yet, so the ensure step creates it out of band and the apply's create then
# collides with it (409 already exists). That rebuild path is not covered by
# this workflow as it stands.
#
# Auth is Workload Identity Federation (NFR-024): no long-lived service-account
# key is committed. Set these repository variables:
#   GCP_PROJECT_ID            sabi-hq
#   GCP_REGION                us-central1
#   GCP_WIF_PROVIDER          projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_SERVICE_ACCOUNT       the deployer service account email
# and this repository secret for the one value only a human can supply:
#   GEMINI_API_KEY            the model provider key

name: gcp-up

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build and deploy (defaults to the short commit SHA)."
        required: false
        type: string
      api_min_instances:
        description: "Minimum API instances (0 keeps idle cost near zero; the default)."
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

concurrency:
  group: gcp-up
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.16.5"
  TF_DIR: infra/terraform-gcp

jobs:
  up:
    name: build, apply, migrate, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: gcp-staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Resolve the deploy tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.image_tag }}" ]; then
            tag="${{ inputs.image_tag }}"
          else
            tag="${GITHUB_SHA::12}"
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          set -euo pipefail
          cp "${TF_DIR}/envs/staging/backend.hcl.example" "${TF_DIR}/envs/staging/backend.hcl"
          terraform -chdir="${TF_DIR}" init -input=false -backend-config=envs/staging/backend.hcl

      - name: Ensure the image repository exists
        # Cloud Run refuses a service or job whose image is not yet in Artifact
        # Registry, and the provider leaves such a half-created service un-State'd
        # (hashicorp/terraform-provider-google#14493). So the repository is
        # ensured here — only when it is absent — and the images are pushed
        # before the single apply, so the workloads can be created in the same
        # pass as the rest of the platform. The repository is Terraform-managed
        # (see the header for the fresh-environment caveat).
        run: |
          set -euo pipefail
          if ! gcloud artifacts repositories describe sabi \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --location="${{ vars.GCP_REGION }}" >/dev/null 2>&1; then
            gcloud artifacts repositories create sabi \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --location="${{ vars.GCP_REGION }}" \
              --repository-format=docker \
              --description="Sabi staging service images (api, ai, payments, console)."
          fi

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push the four images
        env:
          REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sabi
          TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker build -f infra/docker/api.Dockerfile \
            -t "${REGISTRY}/api:${TAG}" -t "${REGISTRY}/api:latest" .
          docker build -f infra/docker/ai.Dockerfile \
            -t "${REGISTRY}/ai:${TAG}" -t "${REGISTRY}/ai:latest" .
          docker build -f infra/docker/payments.Dockerfile \
            -t "${REGISTRY}/payments:${TAG}" -t "${REGISTRY}/payments:latest" .
          docker build -f infra/docker/console.Dockerfile \
            --build-arg SABI_API_ORIGIN="https://api.sabi.${{ vars.GCP_DOMAIN_ROOT || 'ahmadkhidir.com' }}" \
            -t "${REGISTRY}/console:${TAG}" -t "${REGISTRY}/console:latest" .
          for svc in api ai payments console; do
            docker push "${REGISTRY}/${svc}:${TAG}"
            docker push "${REGISTRY}/${svc}:latest"
          done

      - name: Terraform apply
        # One apply. The images now exist, so the Cloud Run services, jobs, their
        # IAM, and the domain mappings are created in the same pass as the
        # platform (D-055).
        env:
          TF_VAR_container_image_tag: ${{ steps.tag.outputs.image_tag }}
          TF_VAR_api_min_instances: ${{ inputs.api_min_instances }}
        run: |
          set -euo pipefail
          cp "${TF_DIR}/envs/staging/terraform.tfvars.example" "${TF_DIR}/envs/staging/terraform.tfvars"
          terraform -chdir="${TF_DIR}" apply -input=false -auto-approve \
            -var-file=envs/staging/terraform.tfvars

      - name: Write the secret Terraform cannot generate
        # The model provider key is written to Secret Manager here, never to the
        # repo or Terraform state (NFR-024). The apply created the container, so
        # the version lands before the migration jobs run.
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GEMINI_API_KEY }}' \
            | gcloud secrets versions add "sabi-staging-gemini-api-key" \
                --project="${{ vars.GCP_PROJECT_ID }}" --data-file=-

      - name: Run the primary-store migrations
        run: |
          set -euo pipefail
          gcloud run jobs execute "sabi-staging-migrate-primary" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --wait

      - name: Run the payment-store migrations
        run: |
          set -euo pipefail
          gcloud run jobs execute "sabi-staging-migrate-payments" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --wait

      - name: Seed the service catalogue
        # The catalogue must exist for the assistant to ground a resolution
        # (FEAT-004), so the seed belongs to the deploy. The job upserts by
        # `name + collecting_body`, so it is safe to run on every `up` (D-048).
        run: |
          set -euo pipefail
          gcloud run jobs execute "sabi-staging-seed-catalogue" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --wait

      - name: Print the mapped URLs and DNS records
        run: |
          set -euo pipefail
          {
            echo "## Sabi staging is up"
            echo
            echo "### Service URLs"
            terraform -chdir="${TF_DIR}" output -json urls
            echo
            echo "### DNS records to add at Namecheap"
            terraform -chdir="${TF_DIR}" output -json dns_records
            echo
            echo "Add the records above, then wait for the managed certificates to become ACTIVE."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show the service URLs in the log
        # `urls` is an object, so it needs -json; -raw only accepts a scalar.
        run: terraform -chdir="${TF_DIR}" output -json urls
