name: sabi_mobile
description: "Sabi client: say it, pay it, prove it."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  rive: ^0.14.11
  http: ^1.6.0
  # Platform secure storage for the session cookie (D-039). Native Flutter has
  # no browser cookie jar, so the HttpOnly session cookie is held here and
  # restored on launch; it is the native equivalent of the browser jar.
  flutter_secure_storage: ^11.2.0
  # Platform authenticator for the WebAuthn ceremony (D-028). The relying party
  # stays self-hosted (C-001-C-004, D-004); the plugin only frames the request
  # and response and runs the OS prompt.
  passkeys: ^2.24.1
  # The official Flutter GenUI SDK, the maintained renderer for A2UI v0.9
  # (FEAT-011, D-051). The package is alpha, so every composed surface has a
  # prewritten fallback and the task never depends on it. `json_schema_builder`
  # and `a2ui_core` are exposed by `genui` transitively; they are declared
  # direct because the catalog and the client-side gate import them.
  genui: ^0.10.4
  json_schema_builder: ^0.1.7
  a2ui_core: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Native icon and launch-screen generation, driven by the brand assets.
  # Configs: flutter_launcher_icons.yaml, flutter_native_splash.yaml.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    # One runtime file holds every artboard (D-016); load by artboard name.
    - assets/sabi.riv
    - assets/splash/
    - assets/app-icon.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Medium.ttf
          weight: 500
