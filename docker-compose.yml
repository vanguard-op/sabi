# Sabi local development dependencies.
#
# Only backing services run here. Application processes run on the host through
# the Makefile (`make backend-dev`, `make ai-dev`, `make mobile-dev`) so that
# local and CI use the exact same commands. Production dependencies are declared
# in infra/terraform.
#
#   docker compose up -d --wait      # start and wait for healthy
#   docker compose down              # stop
#   docker compose down -v           # stop and wipe data

name: sabi

services:
  postgres:
    # Postgres 16 with pgvector preinstalled. D-003: one relational engine covers
    # the primary store, the isolated payment store, full-text search, and
    # retrieval (pgvector).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sabi}
      POSTGRES_USER: ${POSTGRES_USER:-sabi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sabi} -d ${POSTGRES_DB:-sabi}"]
      interval: 5s
      timeout: 5s
      retries: 12

  cache:
    # Sessions, rate-limit counters, and hot catalogue entries (architecture.md).
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
