[alembic]
# Migrations for the primary store live at the repo root because the payment
# store has its own, separate tree. `%(here)s` is services/api.
script_location = %(here)s/../../migrations/primary
prepend_sys_path = .
version_path_separator = os

# Overridden at runtime by env.py from DATABASE_URL. Kept blank on purpose so no
# connection string (with credentials) lives in a tracked file (NFR-024).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
