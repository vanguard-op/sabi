# Sabi AI service. Runtime dependencies are pinned here (NFR-029: versions
# pinned); requirements.txt and requirements-dev.txt are thin editable-install
# shims so CI's pip cache has a path to hash and there is one source of truth.
#
#   pip install -r requirements-dev.txt     # local + CI
#   pip install -e .                        # runtime only
#
# The model build and cost ceilings the service serves are pinned in
# core/config.py, not here: changing a model ID is a model version change and is
# recorded in the model-quality contract.

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sabi-ai"
version = "0.1.0"
description = "Sabi model serving: intent resolution, discovery ranking, interface composition."
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "google-genai==2.28.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[tool.setuptools.packages.find]
# ``core`` is the model-serving foundation; ``app`` is this service's entrypoint
# and health surface. Feature routers (intent, ranking, composition) are mounted
# by app.main and picked up by this pattern as each package lands.
where = ["."]
include = ["app*", "core*", "intent*", "ranking*", "composition*", "payment_intent*"]

[tool.pytest.ini_options]
# Every AI feature package is collected: the model-serving foundation (core), the
# service entrypoint (app), and each capability's feature package (intent, ranking,
# composition). Listing them explicitly means `make test-ai` never silently skips a
# capability as its package lands. ``pythonpath`` makes the service root importable
# regardless of the rootdir pytest infers, so collection is stable from the service
# directory and from CI alike.
testpaths = ["core/tests", "app/tests", "intent/tests", "ranking/tests", "composition/tests", "payment_intent/tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "real_model: exercises the live provider; requires GEMINI_API_KEY and is skipped without it",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
